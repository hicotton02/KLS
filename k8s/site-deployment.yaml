apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeping-law-simple-site
  namespace: keeping-law-simple
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: keeping-law-simple-site
  template:
    metadata:
      labels:
        app: keeping-law-simple-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: registry.skazproconsulting.com/keeping-law-simple/site:20260805-catchup1@sha256:9b73aed7d5780b436c21f60cdec58f965deaa4f45cd254d2a31f5bdd4c9a719b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: KLS_API_BASE_URL
              value: http://keeping-law-simple-web.keeping-law-simple.svc.cluster.local
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keeping-law-simple-site
  namespace: keeping-law-simple
spec:
  selector:
    app: keeping-law-simple-site
  ports:
    - name: http
      port: 80
      targetPort: http
