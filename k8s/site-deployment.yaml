apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeping-law-simple-site
  namespace: keeping-law-simple
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: keeping-law-simple-site
  template:
    metadata:
      labels:
        app: keeping-law-simple-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: registry.skazproconsulting.com/keeping-law-simple/site:20260829-adready1@sha256:1ddbbf569be16a06acf8452a3dcabee49f63c32c122b6012a5aadf804b0d2b8d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: KLS_ADSENSE_PUBLISHER_ID
              value: pub-4907492213987533
            - name: KLS_SITE_ANALYTICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: keeping-law-simple-site-analytics
                  key: KLS_SITE_ANALYTICS_TOKEN
            - name: KLS_API_BASE_URL
              value: http://keeping-law-simple-web.keeping-law-simple.svc.cluster.local
            - name: KLS_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: keeping-law-simple-config
                  key: KLS_PUBLIC_BASE_URL
            - name: KLS_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: keeping-law-simple-config
                  key: KLS_GOOGLE_ANALYTICS_ID
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keeping-law-simple-site
  namespace: keeping-law-simple
spec:
  selector:
    app: keeping-law-simple-site
  ports:
    - name: http
      port: 80
      targetPort: http
