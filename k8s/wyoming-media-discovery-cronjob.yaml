apiVersion: batch/v1
kind: CronJob
metadata:
  name: keeping-law-simple-wyoming-media-discovery
  namespace: keeping-law-simple
spec:
  suspend: false
  schedule: "7 * * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keeping-law-simple
            app.kubernetes.io/component: wyoming-media-discovery
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: registry.skazproconsulting.com/keeping-law-simple/web:20260805-catchup1@sha256:06b006f93da83d4ebb503c0c7a4c85b68e63d0ff3fc632bde20a170dced16354
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - app.cli
                - backfill-wyoming-explanations
                - --stage
                - discover
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keeping-law-simple-postgres-secrets
                      key: KLS_POSTGRES_PASSWORD
                - name: KLS_DATABASE_URL
                  value: postgresql://kls@keeping-law-simple-postgres.keeping-law-simple.svc.cluster.local:5432/kls
              envFrom:
                - configMapRef:
                    name: keeping-law-simple-config
                - secretRef:
                    name: keeping-law-simple-secrets
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          nodeSelector:
            kubernetes.io/hostname: gpu1
