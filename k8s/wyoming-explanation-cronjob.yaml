apiVersion: batch/v1
kind: CronJob
metadata:
  name: keeping-law-simple-wyoming-explanations
  namespace: keeping-law-simple
spec:
  schedule: "*/15 * * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 43200
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keeping-law-simple
            app.kubernetes.io/component: wyoming-explanations
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: init-model-cache
              image: busybox:1.36
              command: ["sh", "-lc", "mkdir -p /models/huggingface && chown 10001:10001 /models/huggingface"]
              volumeMounts:
                - name: model-cache
                  mountPath: /models
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
                allowPrivilegeEscalation: false
          containers:
            - name: worker
              image: registry.skazproconsulting.com/keeping-law-simple/web:20260721-votes3@sha256:34ec271f14c5ae61bb8637805b869cc76bd24abc11bf3a26628301491f17c776
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - app.cli
                - backfill-wyoming-explanations
                - --stage
                - worker
                - --limit-media
                - "1"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keeping-law-simple-postgres-secrets
                      key: KLS_POSTGRES_PASSWORD
                - name: KLS_DATABASE_URL
                  value: postgresql://kls@keeping-law-simple-postgres.keeping-law-simple.svc.cluster.local:5432/kls
                - name: KLS_LOCAL_TRANSCRIPTION_MODEL
                  value: distil-large-v3
                - name: KLS_LOCAL_TRANSCRIPTION_DEVICE
                  value: cpu
                - name: KLS_LOCAL_TRANSCRIPTION_COMPUTE_TYPE
                  value: int8
                - name: KLS_LOCAL_TRANSCRIPTION_THREADS
                  value: "24"
                - name: HF_HOME
                  value: /models/huggingface
              envFrom:
                - configMapRef:
                    name: keeping-law-simple-config
                - secretRef:
                    name: keeping-law-simple-secrets
              resources:
                requests:
                  cpu: "24"
                  memory: 24Gi
                limits:
                  cpu: "48"
                  memory: 96Gi
              volumeMounts:
                - name: model-cache
                  mountPath: /models
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: keeping-law-simple-data
            - name: tmp
              emptyDir:
                sizeLimit: 40Gi
          nodeSelector:
            kubernetes.io/hostname: gpu2
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: rtx5090-lab
              effect: NoSchedule
