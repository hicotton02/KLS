apiVersion: batch/v1
kind: CronJob
metadata:
  name: keeping-law-simple-sync
  namespace: keeping-law-simple
  labels:
    skazpro.com/customer: skazpro
    skazpro.com/scope: skazpro
    skazpro.com/grace-seconds: "93600"
spec:
  schedule: "15 2 * * *"
  timeZone: America/Denver
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completions: 52
      parallelism: 32
      completionMode: Indexed
      activeDeadlineSeconds: 82800
      backoffLimitPerIndex: 1
      maxFailedIndexes: 52
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keeping-law-simple
            app.kubernetes.io/component: sync
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: init-data-permissions
              image: busybox:1.36@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
              command:
                - sh
                - -lc
                - mkdir -p /data/geoip
              volumeMounts:
                - name: data
                  mountPath: /data
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          restartPolicy: Never
          containers:
            - name: sync
              image: registry.skazproconsulting.com/keeping-law-simple/web:20260806-workerexit1@sha256:5fa0526e9a318890d369d4b2b3744e3de1e3d2c9e7d3fec0910e973f3d9c67c7
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -lc
                - |
                  set -eu
                  python - <<'PY'
                  from __future__ import annotations

                  import json
                  import os
                  from dataclasses import asdict

                  from app.db import reset_stale_sync_statuses
                  from app.sync_service import SYNC_STATE_ORDER, sync_state_by_name


                  raw_index = os.environ.get("JOB_COMPLETION_INDEX")
                  if raw_index is None:
                      raw_index = os.environ.get("HOSTNAME", "").rsplit("-", 1)[-1]
                  index = int(raw_index)
                  if index < 0 or index >= len(SYNC_STATE_ORDER):
                      raise RuntimeError(
                          f"KLS sync index {index} is outside 0..{len(SYNC_STATE_ORDER) - 1}."
                      )

                  if index == 0:
                      cleared = reset_stale_sync_statuses(21600)
                      print(f"Cleared {cleared} stale sync status rows.", flush=True)

                  state = SYNC_STATE_ORDER[index]
                  print(f"Starting source-only KLS sync {index}: {state}", flush=True)
                  stats = sync_state_by_name(
                      state,
                      skip_interpretation=True,
                      logger=print,
                  )
                  print(
                      json.dumps(
                          {
                              "index": index,
                              "state": state,
                              "source_only": True,
                              "stats": asdict(stats),
                          },
                          indent=2,
                      ),
                      flush=True,
                  )
                  PY
              env:
                - name: KLS_SYNC_PARALLELISM
                  value: "1"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keeping-law-simple-postgres-secrets
                      key: KLS_POSTGRES_PASSWORD
                - name: KLS_DATABASE_URL
                  value: postgresql://kls@keeping-law-simple-postgres.keeping-law-simple.svc.cluster.local:5432/kls
              envFrom:
                - configMapRef:
                    name: keeping-law-simple-config
                - secretRef:
                    name: keeping-law-simple-secrets
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "4"
                  memory: 4Gi
          volumes:
            - name: data
              emptyDir: {}
            - name: tmp
              emptyDir: {}
          nodeSelector:
            kubernetes.io/hostname: gpu2
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: rtx5090-lab
              effect: NoSchedule
