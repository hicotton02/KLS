apiVersion: batch/v1
kind: CronJob
metadata:
  name: keeping-law-simple-wyoming-news
  namespace: keeping-law-simple
spec:
  suspend: false
  schedule: "23 * * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1500
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keeping-law-simple
            app.kubernetes.io/component: wyoming-news
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: registry.skazproconsulting.com/keeping-law-simple/web:20261102-news2-worker@sha256:c4d3755edaf5a188ac5a015c9d3a9d253cfe4fbea09a328843d62d867257c38d
              imagePullPolicy: IfNotPresent
              command: [python, -u, -m, app.wyoming_news, --limit, "6"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keeping-law-simple-postgres-secrets
                      key: KLS_POSTGRES_PASSWORD
                - name: KLS_DATABASE_URL
                  value: postgresql://kls@keeping-law-simple-postgres.keeping-law-simple.svc.cluster.local:5432/kls
                - name: KLS_OLLAMA_BASE_URL
                  value: http://ai-inference-ollama.ai-platform.svc.cluster.local:11435
                - name: KLS_OLLAMA_TIMEOUT_SECONDS
                  value: "600"
              envFrom:
                - configMapRef:
                    name: keeping-law-simple-config
                - secretRef:
                    name: keeping-law-simple-secrets
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
