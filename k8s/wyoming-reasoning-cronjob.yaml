apiVersion: batch/v1
kind: CronJob
metadata:
  name: keeping-law-simple-wyoming-reasoning
  namespace: keeping-law-simple
spec:
  suspend: false
  schedule: "*/5 * * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      backoffLimit: 2
      completions: 4
      parallelism: 4
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keeping-law-simple
            app.kubernetes.io/component: wyoming-reasoning
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: registry.skazproconsulting.com/keeping-law-simple/web:20260811-health2@sha256:81947f12ccf4d7e02b863ce3673509fea3b76591485db1eeb88149256591033e
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - app.cli
                - backfill-wyoming-explanations
                - --stage
                - extract
                - --limit-media
                - "2"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keeping-law-simple-postgres-secrets
                      key: KLS_POSTGRES_PASSWORD
                - name: KLS_DATABASE_URL
                  value: postgresql://kls@keeping-law-simple-postgres.keeping-law-simple.svc.cluster.local:5432/kls
                - name: KLS_OLLAMA_BASE_URL
                  value: http://ai-inference-ollama.ai-platform.svc.cluster.local:11435
                - name: KLS_OLLAMA_TIMEOUT_SECONDS
                  value: "1800"
              envFrom:
                - configMapRef:
                    name: keeping-law-simple-config
                - secretRef:
                    name: keeping-law-simple-secrets
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          nodeSelector:
            kubernetes.io/hostname: gpu1
