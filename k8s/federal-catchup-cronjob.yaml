apiVersion: batch/v1
kind: CronJob
metadata:
  name: keeping-law-simple-federal-catchup
  namespace: keeping-law-simple
  labels:
    skazpro.com/customer: skazpro
    skazpro.com/scope: skazpro
    skazpro.com/grace-seconds: "7200"
spec:
  schedule: "*/5 * * * *"
  timeZone: America/Denver
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keeping-law-simple
            app.kubernetes.io/component: federal-catchup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: registry.skazproconsulting.com/keeping-law-simple/web:20261003-weekly1@sha256:d59d5923350cae9d44758cce643d9ec1b33a2b90fab231dd1198718b8201c921
              command: [python, -m, app.federal_sync, --limit, "100"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keeping-law-simple-postgres-secrets
                      key: KLS_POSTGRES_PASSWORD
                - name: KLS_DATABASE_URL
                  value: postgresql://kls@keeping-law-simple-postgres.keeping-law-simple.svc.cluster.local:5432/kls
                - name: PGOPTIONS
                  value: "-c statement_timeout=60000 -c lock_timeout=10000"
              envFrom:
                - configMapRef:
                    name: keeping-law-simple-config
                - secretRef:
                    name: keeping-law-simple-secrets
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: tmp
              emptyDir: {}
