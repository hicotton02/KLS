apiVersion: batch/v1
kind: CronJob
metadata:
  name: keeping-law-simple-summaries-federal
  namespace: keeping-law-simple
spec:
  schedule: "*/5 * * * *"
  timeZone: America/Denver
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      completionMode: Indexed
      completions: 4
      parallelism: 4
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keeping-law-simple
            app.kubernetes.io/component: summaries-federal
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: registry.skazproconsulting.com/keeping-law-simple/web:20261010-gpu2-queue1@sha256:87172c99ab6fa43041660d71baf67e07d1c3da9c735b9e84189ffe6b3dc1a77e
              command: [python, -u, -m, app.summary_queue, --state, us, --limit, "32", --deadline-seconds, "1500"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keeping-law-simple-postgres-secrets
                      key: KLS_POSTGRES_PASSWORD
                - name: KLS_DATABASE_URL
                  value: postgresql://kls@keeping-law-simple-postgres.keeping-law-simple.svc.cluster.local:5432/kls
                - name: PGOPTIONS
                  value: "-c statement_timeout=60000 -c lock_timeout=10000"
                - name: KLS_OLLAMA_BASE_URL
                  value: http://ai-inference-ollama.ai-platform.svc.cluster.local:11435
                - name: KLS_OLLAMA_TIMEOUT_SECONDS
                  value: "600"
              envFrom:
                - configMapRef:
                    name: keeping-law-simple-config
                - secretRef:
                    name: keeping-law-simple-secrets
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
